name: Operon Forge Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.2.6-forge.1)"
        required: false
        type: string
      draft:
        description: "Draft release"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node and Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4

      - name: Fetch models snapshot
        run: |
          mkdir -p .cache/models-catalog
          bun packages/core/script/update-models-snapshot.ts .cache/models-catalog/api.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            PKG_VER=$(node -p "require('./package.json').version || '2.2.5'")
            TAG="v${PKG_VER}-forge.$(date +%Y%m%d%H%M)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build Operon Forge CLI
        working-directory: packages/cli
        run: |
          bun run build
        env:
          OPENCODE_TARGET: ${{ matrix.target }}
          OPENCODE_CLI_NAME: operon-forge
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_MODELS_SNAPSHOT: ${{ github.workspace }}/.cache/models-catalog/api.json
          BUN_COMPILE_RELEASE: bun-v1.4.4
          GH_TOKEN: ${{ github.token }}

      - name: Package tarball
        shell: bash
        run: |
          CLI_DIST="packages/cli/dist/cli-${{ matrix.target }}"
          mkdir -p dist-release
          TARBALL="dist-release/operon-forge-${{ matrix.target }}.tar.gz"
          
          # Archive binaries
          tar -czf "$TARBALL" -C "$CLI_DIST/bin" operon-forge opencode
          echo "Created $TARBALL"
          ls -lh "$TARBALL"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: operon-forge-${{ matrix.target }}
          path: dist-release/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            PKG_VER=$(node -p "require('./package.json').version || '2.2.5'")
            TAG="v${PKG_VER}-forge.$(date +%Y%m%d%H%M)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Operon Forge ${{ steps.version.outputs.tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: false
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
